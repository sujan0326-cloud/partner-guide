<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K2 협력사 납품가이드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Pretendard';src:url(__PTFONT__) format('woff2');font-weight:45 920;font-style:normal;font-display:swap}
/* VOICE: 회사 홈페이지처럼 차분하고 정돈된 실무 안내
   IDEA: 포장 유형별 한 장짜리 기준 보드 (인쇄하면 그대로 A4 한 장)
   PICTURE: 첫 화면의 흑백 센터·포장 사진 타일, 보드에서는 규칙 사진
   COLOUR/TYPE: 남색 #162036 하나 + 흰 바탕, 빨강은 입고 거부, 초록은 정상 표시에만 / Pretendard + Montserrat 라벨
   LAYOUT: 첫 화면 2×2 타일 → 보드는 단계 카드 2열 + 오른쪽 고정 상세 */
:root{color-scheme:light;--navy:#162036;--navy2:#33415e;--ink:#333;--sub:#666;--mute:#8a93a6;--paper:#f4f4f2;--line:#e9eaed;--line2:#f0f1f3;--red:#a50d25;--redbg:#fdecee;--en:'Montserrat','Pretendard',sans-serif}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:80px}
body{margin:0;background:#fff;color:var(--ink);font:16px/1.6 'Pretendard',-apple-system,'Malgun Gothic',sans-serif;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.wrap{max-width:none;margin:0;padding:0 clamp(24px,3.2vw,64px)}
.en{font-family:var(--en);letter-spacing:2px;font-weight:600;font-size:12px}
/* header */
.hd{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line)}
.hd .wrap{position:relative;z-index:3;display:flex;align-items:center;gap:28px;height:76px}
.logo{display:flex;border:0;background:none;padding:0}.logo img{height:24px;display:block}.logo .w{display:none}
.nav{display:flex;flex-grow:1;align-self:stretch}
.gi{position:relative;display:flex;width:168px}
.gi>a{position:relative;display:flex;align-items:center;padding:0 22px;color:inherit;text-decoration:none;font-weight:500;font-size:15px;white-space:nowrap;opacity:.85;transition:opacity .2s}
.gi>a:hover,.gi:hover>a{opacity:1}.gi>a.on{opacity:1;font-weight:700}
.gi>a.on::after,.gi:hover>a::after{content:'';position:absolute;left:22px;right:22px;bottom:0;height:2px;background:currentColor}
.sub{position:absolute;top:100%;left:0;min-width:100%;padding:22px 22px 26px;display:flex;flex-direction:column;gap:12px;opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .25s ease,transform .25s ease,visibility .25s;z-index:2}
.sub a{color:var(--sub);text-decoration:none;font-size:14px;white-space:nowrap;transition:color .2s}.sub a:hover{color:var(--navy);font-weight:500}
.hd::after{content:'';position:absolute;left:0;right:0;top:100%;height:var(--ddh,170px);background:#fff;border-top:1px solid var(--line);box-shadow:0 18px 30px rgba(22,32,54,.08);opacity:0;visibility:hidden;transition:opacity .25s ease,visibility .25s;z-index:1;pointer-events:none}
.hd:has(.nav:hover)::after,.hd:has(.nav:focus-within)::after{opacity:1;visibility:visible}
.nav:hover .sub,.nav:focus-within .sub{opacity:1;visibility:visible;transform:none}
.hd.shut .sub,.hd.shut::after{opacity:0!important;visibility:hidden!important}
.srch{position:relative;width:300px;flex:none}
.srch input{width:100%;height:42px;padding:0 16px 0 40px;border:1px solid #cfd3da;border-radius:21px;font:inherit;font-size:15px;background:#fff;color:var(--ink)}
.srch svg{position:absolute;left:14px;top:12px;color:var(--mute)}
.res{position:absolute;top:48px;right:0;width:min(440px,90vw);max-height:420px;overflow-y:auto;background:#fff;border:1px solid var(--line);box-shadow:0 18px 40px rgba(22,32,54,.16);display:none;z-index:40}
.res.show{display:block}
.res button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line2);background:#fff;padding:12px 16px}
.res button:hover,.res button.k{background:#f4f6f9}
.res small{display:block;color:var(--mute);font-size:12px}.res .none{padding:16px;color:var(--sub);font-size:14px}
.pbtn{display:none;align-items:center;gap:8px;height:42px;padding:0 18px;border:1px solid rgba(255,255,255,.7);border-radius:21px;background:transparent;color:#fff;font-size:14px;flex:none}
body.inb .hd{background:var(--navy);color:#fff;border-bottom:0}
body.inb .logo .d{display:none}body.inb .logo .w{display:block}
body.inb .srch input{border-color:transparent}body.inb .pbtn{display:inline-flex}
.mtog{display:none}
/* landing */
.intro{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:calc(var(--ddh,170px) + 32px) 0 40px}
.intro h1{margin:12px 0 0;font-size:clamp(32px,4.4vw,50px);line-height:1.1;font-weight:700;letter-spacing:-1.5px}
.intro p{margin:0;text-align:right;color:var(--sub);line-height:1.8}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(16px,1.6vw,28px);padding-bottom:88px}
.tile{position:relative;overflow:hidden;aspect-ratio:auto;width:100%;height:min(calc((100vw - 2 * clamp(24px,3.2vw,64px) - 60px) / 4), max(260px, calc(100vh - var(--ddh,170px) - 250px)));background:var(--navy);color:#fff;border:0;padding:0;display:block;text-align:center}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(100%) contrast(1.05);transition:transform 1s ease}
.tile .ov{position:absolute;inset:0;background:rgba(10,15,28,.45);transition:background .4s ease}
.tile .ct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px}
.tile .en{color:#d5dbe7;letter-spacing:3px}
.tile h2{margin:0;font-size:clamp(26px,2.2vw,36px);font-weight:700;letter-spacing:-1px}
.tile .ds{display:flex;flex-direction:column;align-items:center;gap:16px;max-height:0;opacity:0;overflow:hidden;transform:translateY(8px);transition:max-height .45s ease,opacity .35s ease,transform .45s ease}
.tile .ds span{color:#e6eaf1}
.tile:hover img,.tile:focus-within img{transform:scale(1.06)}
.tile:hover .ov,.tile:focus-within .ov{background:rgba(10,15,28,.72)}
.tile:hover .ds,.tile:focus-within .ds{max-height:220px;opacity:1;transform:none}
.more{display:inline-flex;align-items:center;height:42px;padding:0 30px;border:1px solid rgba(255,255,255,.85);border-radius:21px;font-family:var(--en);font-size:13px;font-weight:500;letter-spacing:1px;background:transparent;color:#fff}
.pill{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:520px}
.pill button,.more{transition:background .25s,color .25s}
.pill button{height:40px;padding:0 15px;font-size:14px!important;border:1px solid rgba(255,255,255,.8);border-radius:22px;background:transparent;color:#fff;font-size:15px;font-weight:500;white-space:nowrap}
.pill button:hover,.more:hover,.pill button:focus-visible{background:#fff;color:var(--navy)}
.tile .hit{position:absolute;inset:0;z-index:0;border:0;background:transparent}
.tile .ct{z-index:1;pointer-events:none}.tile .ct button{pointer-events:auto}
/* board */
.tabs{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:76px;z-index:25}
.tabs .wrap{display:flex;gap:36px;overflow-x:auto;scrollbar-width:none}
.tab{flex:none;height:52px;padding:0;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--sub);font-size:15px;font-weight:500;white-space:nowrap;transition:color .25s,border-color .25s}
.tab:hover{color:var(--ink)}.tab.on{color:var(--navy);font-weight:700;border-bottom-color:var(--navy)}
.mcat{display:none}
.board{background:var(--paper);padding:30px 0 72px;min-height:70vh}
.bhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.crumb{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13px;color:var(--mute)}.crumb button{border:0;background:none;padding:0;color:var(--mute);font-size:13px}.crumb button:hover{color:var(--navy)}.crumb span:last-child{color:var(--sub)}
.bhead h1{margin:0 0 4px;font-size:22px;line-height:1.3;font-weight:700;letter-spacing:-.4px}
.bhead p{margin:0;color:var(--sub);font-size:14px}.bhead .note{color:var(--red);font-size:13px;margin-top:4px}
.legend{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--sub)}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:2px;font-size:11px;font-weight:600;white-space:nowrap;flex:none;background:var(--redbg);color:var(--red)}
.tag.dk{background:#111;color:#fff}
.lay{display:flex;gap:clamp(24px,2.6vw,48px);align-items:flex-start}
.cards{flex:1 1 auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(16px,1.6vw,28px);align-content:start}
.card{background:#fff;border:1px solid var(--line);padding:32px 30px;transition:box-shadow .35s ease,transform .35s ease}
.card:hover{box-shadow:0 10px 28px rgba(22,32,54,.06)}
.card .en{font-size:11px;color:var(--mute)}
.card h3{margin:6px 0 4px;padding-bottom:14px;border-bottom:1px solid var(--navy);font-size:18px;font-weight:700;letter-spacing:-.3px}
.row{display:flex;align-items:center;gap:10px;width:100%;min-height:80px;padding-top:10px!important;padding-bottom:10px!important;padding:0 12px;border:0;border-bottom:1px solid var(--line2);background:transparent;text-align:left;transition:background .3s ease}
.row:hover{background:#f6f7f9}
.row.on{background:#eceff5;box-shadow:inset 3px 0 0 var(--navy)}
.row .tx{flex:1 1 auto;font-size:15px;line-height:1.42;}
.row .ph{flex:none;display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--navy2);white-space:nowrap}.row .ph.no{color:var(--mute)}
.pnl{flex:0 0 clamp(440px,28vw,600px);position:sticky;top:150px;height:820px;max-height:calc(100vh - 170px);overflow-y:auto;overscroll-behavior:contain;background:#fff;border-top:3px solid var(--navy);padding:22px;display:flex;flex-direction:column;gap:14px}
.chiprow{display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:12px;background:var(--navy);color:#fff;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pnl>*{flex:none}.pnl h2{margin:0;font-size:21px;line-height:1.45;font-weight:700;min-height:2.9em}
.why{margin:-6px 0 0;font-size:14px;color:var(--sub)}
.cap{display:flex;align-items:center;gap:10px;height:30px;font-size:14px;overflow:hidden}
.cap .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cap .m{color:var(--mute)}
.kind{flex:none;display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 11px;border-radius:3px;font-size:13px;font-weight:700;white-space:nowrap}
.kind{border:1px solid #d5d8de;background:#fff;color:var(--ink);font-weight:600}.k-ref,.k-dia{color:var(--sub)}
.shot{position:relative;flex:none;height:280px;background:#f4f5f7;display:flex;align-items:center;justify-content:center;overflow:hidden;border:0;padding:0;cursor:zoom-in}
.shot img{max-width:100%;max-height:100%;object-fit:contain;transition:transform .5s ease}.shot:hover img{transform:scale(1.03)}
.empty{flex:none;height:280px;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:20px;border:1px dashed #c5c9d0;background:#fafafa}
.empty b{font-size:15px}.empty span{font-size:14px;color:var(--sub)}
.seg{flex:none;display:flex;gap:0;height:34px;border-bottom:1px solid var(--line)}
.seg button{flex:1 1 0;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;background:transparent;font-size:13px;font-weight:500;color:var(--sub);white-space:nowrap;transition:background .25s,color .25s}
.seg button b{font-weight:500;color:var(--mute);margin-left:3px}
.seg button:hover:not(:disabled){color:var(--ink)}.seg button.on{color:var(--navy);font-weight:700;border-bottom-color:var(--navy)}
.seg button:disabled{opacity:.35;cursor:default}
.pair{flex:none;height:280px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.half{position:relative;background:#f4f5f7;display:flex;align-items:center;justify-content:center;overflow:hidden;border:0;padding:0;cursor:zoom-in}
.half img{max-width:100%;max-height:100%;object-fit:contain}
.half .none{font-size:13px;color:var(--mute);padding:12px;text-align:center}
.phead{display:grid;grid-template-columns:1fr 1fr;gap:8px;height:30px;align-items:center}
.phead div{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--sub)}
.phead b{font-weight:600;color:var(--ink);margin-right:6px}
.arr{display:inline-flex;align-items:center}.arr span{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;color:var(--mute);font-size:17px;cursor:pointer;transition:color .2s}.arr span:hover{color:var(--navy)}
.pcap{flex:1 1 auto;display:grid;grid-template-columns:1fr 1fr;gap:8px;height:46px;font-size:13px;line-height:1.45;color:var(--sub)}
.pcap span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.thr{display:flex;align-items:center;gap:10px}
.ths{display:flex;gap:8px;overflow-x:auto;flex:1 1 auto;padding:2px}
.th{flex:none;width:76px;height:58px;padding:0;border:1px solid var(--line);background:#f4f5f7;opacity:.65;transition:opacity .25s,border-color .25s}
.th img{width:100%;height:100%;object-fit:cover;display:block}.th:hover{opacity:1;border-color:var(--navy)}.th.on{opacity:1;border:2px solid var(--navy)}
.zoom{flex:none;display:inline-flex;align-items:center;gap:6px;height:46px;padding:0 14px;border:0;border-radius:2px;background:var(--navy);color:#fff;font-size:14px;transition:background .25s}.zoom:hover{background:var(--navy2)}
.det{border-top:1px solid var(--line)}
.det>button{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:52px;border:0;background:none;padding:0;font-size:15px;font-weight:700}
.plus{flex:none;position:relative;width:30px;height:30px;border-radius:50%;background:#c9cdd4;transition:transform .3s ease,background .2s}.plus::before,.plus::after{content:'';position:absolute;left:50%;top:50%;width:12px;height:1.5px;margin:-.75px 0 0 -6px;background:#fff}.plus::after{transform:rotate(90deg)}
.det>button:hover .plus{background:var(--navy2)}.det>button[aria-expanded=true] .plus{transform:rotate(45deg);background:var(--navy)}
.det .bd{display:flex;flex-direction:column;gap:10px;padding-bottom:6px}
.det strong{display:block;font-size:13px;color:var(--sub)}.det p{margin:0;font-size:14px;line-height:1.65}
.det table{border-collapse:collapse;width:100%;font-size:13px}.det td{border:1px solid var(--line);padding:7px 9px;vertical-align:top}
.src{font-size:12px;color:var(--mute)}
.ask{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:46px;border:1px solid var(--navy);background:#fff;color:var(--navy);font-size:14px;font-weight:700}
.x{display:none}
.mtog{flex:none;display:flex;gap:0;border:1px solid var(--line)}.mtog button{flex:1 1 0;height:36px;border:0;background:#fff;color:var(--sub);font-size:13px}.mtog button.on{background:var(--navy);color:#fff;font-weight:600}
.m3{flex:none;position:relative;height:280px;background:#f4f5f7;display:flex;align-items:center;justify-content:center;perspective:900px;touch-action:none;user-select:none;cursor:grab;overflow:hidden}.m3:active{cursor:grabbing}
.m3h{position:absolute;top:10px;right:12px;font-size:11px;color:var(--mute)}
.m3s{position:absolute;bottom:22px;width:230px;height:46px;background:rgba(22,32,54,.14);filter:blur(16px);border-radius:50%}
.carton{width:240px;height:160px;position:relative;transform-style:preserve-3d;transition:transform .45s ease}.carton.drag{transition:none}
.face{position:absolute;left:50%;top:50%;backface-visibility:hidden;border:1px solid #a88e69;background:linear-gradient(110deg,#c9b38f,#b89d75);display:flex;align-items:center;justify-content:center}
.face.front,.face.back{width:240px;height:160px;margin:-80px 0 0 -120px}.face.front{transform:translateZ(78px)}.face.back{transform:rotateY(180deg) translateZ(78px)}
.face.left,.face.right{width:156px;height:160px;margin:-80px 0 0 -78px;background:linear-gradient(90deg,#c2aa81,#b59b72)}.face.left{transform:rotateY(-90deg) translateZ(120px)}.face.right{transform:rotateY(90deg) translateZ(120px)}
.face.top,.face.bottom{width:240px;height:156px;margin:-78px 0 0 -120px;background:#d8c7a7}.face.top{transform:rotateX(90deg) translateZ(80px)}.face.bottom{transform:rotateX(-90deg) translateZ(80px)}
.face.top::after{content:'';position:absolute;width:30px;top:0;bottom:0;left:calc(50% - 15px);background:#b09a7166;border-left:1px solid #b09a71;border-right:1px solid #b09a71}
.fc{font:600 10px var(--en);letter-spacing:2px;color:#7d6742;border:1px solid #aa906c;padding:10px;text-align:center}.fc small{display:block;font:500 8px 'Pretendard',sans-serif;margin-top:6px;letter-spacing:0}
.stk{position:absolute;top:16px;left:calc(50% - 40px);width:80px;height:48px;background:#fff;border:1px solid #d7d9de;padding:5px 6px;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.stk small{display:block;font:600 5.5px var(--en);color:#222}.stk i{display:block;height:17px;margin:3px 0;background:repeating-linear-gradient(90deg,#222 0 1px,#fff 1px 3px,#222 3px 5px,#fff 5px 7px,#222 7px 8px,#fff 8px 11px)}
.stk.miss{opacity:0}.stk.tape::after{content:'';position:absolute;left:-26px;right:-26px;top:18px;height:17px;background:rgba(171,131,78,.6);border:1px solid #9d7a44;transform:rotate(-12deg)}
.fn{position:absolute;bottom:14px;font-size:9px;color:#735d37}
.m3b{flex:none;display:flex;justify-content:center}.angs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.angs button{height:34px;padding:0 12px;border:1px solid var(--line);background:#fff;font-size:12.5px;color:var(--ink);transition:border-color .2s,color .2s}.angs button:hover{border-color:var(--navy);color:var(--navy)}
.m3n{flex:none;margin:0;font-size:14px;line-height:1.6;color:var(--ink)}.m3n span{font-size:12px;color:var(--mute)}
.bag{width:190px;height:240px;position:relative;transform-style:preserve-3d;transition:transform .5s ease}.bag.drag{transition:none}
.bf{position:absolute;inset:0;backface-visibility:hidden;border-radius:6px;background:linear-gradient(135deg,rgba(235,240,246,.9),rgba(205,213,224,.95));box-shadow:0 0 0 1px rgba(150,160,175,.6),inset 0 0 18px rgba(255,255,255,.6)}
.bf.back{transform:rotateY(180deg)}
.bf .shirt{position:absolute;inset:0;width:100%;height:100%}
.bf .gloss{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:screen}
.bf::after{content:'';position:absolute;inset:0;border-radius:6px;background:linear-gradient(115deg,rgba(255,255,255,.28),transparent 35%,transparent 60%,rgba(255,255,255,.18));pointer-events:none}
.clogo{position:absolute;left:0;right:0;top:94px;text-align:center;font:italic 800 34px var(--en);color:#fff;letter-spacing:-1px;text-shadow:0 1px 1px rgba(0,0,0,.15)}
.htag{position:absolute;width:52px;height:78px;background:#f7f7f4;border-radius:2px;padding:6px 5px;box-shadow:0 2px 4px rgba(0,0,0,.35);transform:rotate(-8deg)}
.htag.onback{left:72px;top:56px;transform:rotate(-4deg)}.htag.onfront{left:98px;top:58px;transform:rotate(6deg)}
.htag small{display:block;font:600 4.5px var(--en);color:#333;letter-spacing:.2px}.htag b{display:block;font:700 7px var(--en);color:#111;margin:3px 0}
.htag i{display:block;height:20px;margin:3px 0;background:repeating-linear-gradient(90deg,#222 0 1px,#f7f7f4 1px 3px,#222 3px 4px,#f7f7f4 4px 6px)}

<script>
{
const BASE = __MODEL__;
const IMGF = __IMGF__;
const SHEET_ID = '__SHEET_ID__';
const RED = ['입고 거부', '입고 불가', '반송'];
let B = [], IT = {}, byId = {}, CATS = [], CENTERS = [], INDEX = [];
const srcOf = f => IMGF[f] || (f ? 'img/' + f : '');
const kindKey = k => /^정상/.test(k) ? 'ok' : /^불량/.test(k) ? 'bad' : /^설명 그림/.test(k) ? 'dia' : 'ref';
const grpOf = k => /정상/.test(k) ? 'ok' : /불량/.test(k) ? 'bad' : 'ref';
function build(M) {
  const res = id => { let x = M.items[id]; if (x && x.ref) x = M.items[x.ref]; return x && !x.ref ? x : null; };
  B = M.pages.map(p => ({id: p.id, tab: p.sub || p.title, title: p.title, sub: p.desc, en: p.en, layout: p.layout, cat: p.cat,
    steps: p.steps.map(s => ({n: String(s.n), t: s.t, art: s.art || '', items: s.items.filter(id => res(id))})).filter(s => s.items.length)})).filter(b => b.steps.length || (b.layout && b.layout !== '기본'));
  IT = {};
  B.forEach(b => b.steps.forEach(s => s.items.forEach(id => { const x = res(id); IT[id] = Object.assign({}, x, {id, table: x.table || [], media: (x.media || []).map(m => [kindKey(m[0]), srcOf(m[1]), m[2] || '', grpOf(m[0])])}); })));
  byId = Object.fromEntries(B.map(b => [b.id, b]));
  CATS = M.cats.map(c => Object.assign({}, c, {pages: B.filter(b => b.cat === c.name)})).filter(c => c.pages.length);
  CENTERS = M.centers.length ? M.centers : [{id: '', name: '센터'}];
  INDEX = [];
  B.forEach(b => b.steps.forEach(s => s.items.forEach(id => { const x = IT[id]; INDEX.push({b, s, x, h: norm([x.text, x.rid, x.why, x.exc, x.act, x.todo, b.tab, s.t].join(' '))}); })));
}
/* reads the Google Sheet (shared as 'anyone with the link can view'); falls back to the built-in content */
function parseCSV(t) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < t.length; i++) { const ch = t[i];
    if (q) { if (ch === '"') { if (t[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true; else if (ch === ',') { row.push(cell); cell = ''; }
    else if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; } else if (ch !== '\r') cell += ch; }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  const h = rows.shift() || []; return rows.filter(r => r.some(v => v.trim())).map(r => Object.fromEntries(h.map((k, i) => [k.trim(), (r[i] || '').trim()])));
}
async function loadSheet() {
  if (!SHEET_ID) return;
  const tab = n => fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(n)}`).then(r => { if (!r.ok) throw 0; return r.text(); }).then(parseCSV);
  try {
    const [cm, pg, st, it, ph, ce] = await Promise.all(['큰 메뉴', '페이지', '단계', '항목', '사진', '센터'].map(tab));
    if (!pg.length || !it.length) return;
    const by = k => (a, b) => (+a[k] || 0) - (+b[k] || 0);
    const art = (pid, n) => { const p = BASE.pages.find(x => x.id === pid); const s = p && p.steps.find(x => x.n === n); return s ? s.art : ''; };
    const items = {};
    it.forEach(r => { const id = r['항목ID']; if (!id) return; items[id] = r['같은 내용 가져오기'] ? {ref: r['같은 내용 가져오기']} :
      {text: r['문장'], tag: r['표시'], rid: r['규칙번호'], why: r['이유'], exc: r['예외·주의'], act: r['확인·대응'], source: r['근거'],
       table: (r['표'] || '').split('\n').filter(Boolean).map(l => l.split('|').map(c => c.trim())), nophoto: /^y/i.test(r['사진 없이 글로 충분']), todo: r['필요한 사진'], media: []}; });
    ph.sort(by('순서')).forEach(r => { const x = items[r['항목ID']]; if (x && x.media) x.media.push([r['종류'], r['파일'], r['설명']]); });
    const M = {
      cats: cm.sort(by('순서')).map(r => ({name: r['큰 메뉴'], en: r['영문 라벨'], desc: r['첫 화면 설명'], img: r['첫 화면 사진']})),
      pages: pg.sort(by('순서')).map(r => { const id = r['페이지ID'];
        return {cat: r['큰 메뉴'], sub: r['작은 메뉴'], id, title: r['페이지 제목'], desc: r['한 줄 설명'], en: r['영문 라벨'], layout: r['모양'] || '기본',
          steps: st.filter(x => x['페이지ID'] === id).map(x => ({n: String(x['단계']).replace(/\.0$/, ''), t: x['단계 제목']})).sort((a, b) => +a.n - +b.n)
            .map(s => ({n: s.n, t: s.t, art: art(id, s.n), items: it.filter(x => x['페이지ID'] === id && String(x['단계']).replace(/\.0$/, '') === s.n).sort(by('순서')).map(x => x['항목ID'])}))}; }),
      items, centers: ce.map((r, i) => { const d = (BASE.centers || []).find(x => x.id === r['센터ID']) || (BASE.centers || [])[i] || {}; return {id: r['센터ID'], name: r['센터 이름'] || d.name, addr: r['도로명 주소'] || d.addr || '', jibun: r['지번 주소'] || d.jibun || '', kinds: r['입고 가능 복종'] || d.kinds || '', map: r['지도 링크'] || d.map || ''}; })};
    build(M); renderChrome(); route();
  } catch (e) { /* keep built-in content */ }
}
const $ = s => document.querySelector(s);
const norm = s => String(s).toLowerCase().replace(/\s+/g, '');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tag = t => t ? `<span class="tag${RED.includes(t) ? '' : ' dk'}">${esc(t)}</span>` : '';
const CAM = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';
const KIND = {ok: ['k-ok', '정상'], bad: ['k-bad', '불량'], dia: ['k-dia', '설명 그림'], ref: ['k-ref', '참고']};
let cIdx = 0; // 센터 정보는 시트의 '센터' 탭에서 고칩니다
const catOf = v => (byId[v] || {}).cat;
const catPages = name => (CATS.find(c => c.name === name) || {pages: []}).pages;
/* 하위 메뉴 묶음: 같은 묶음의 페이지는 메뉴에 한 번만 나오고, 페이지 안 탭으로 오갑니다 */
const GRP = {reserve: '입고예약', rclose: '입고예약', rfix: '입고예약', rcost: '매입반품', rnote: '매입반품'};
const GTAB = {reserve: '예약 안내', rclose: '마감·시간 준수', rfix: '예약 수정', rcost: '비용 기준', rnote: '재입고 예약'};
const grpOfPage = p => GRP[p.id] || '';
const menuPages = c => { const seen = new Set(); return c.pages.filter(p => { const g = grpOfPage(p); if (!g) return true; if (seen.has(g)) return false; seen.add(g); return true; }).map(p => grpOfPage(p) ? Object.assign({}, p, {tab: grpOfPage(p)}) : p); };
const gtabsHTML = b => { const gm = grpMembers(b); return gm.length > 1 ? `<nav class="gtabs" aria-label="${esc(grpOfPage(b))}">${gm.map(x => `<button type="button" class="${x.id === b.id ? 'on' : ''}" aria-current="${x.id === b.id ? 'page' : 'false'}" data-go="${x.id}">${esc(GTAB[x.id] || x.tab)}</button>`).join('')}</nav>` : ''; };
const grpMembers = b => grpOfPage(b) ? catPages(b.cat).filter(x => grpOfPage(x) === grpOfPage(b)) : [];
function renderChrome() {
  const subOf = c => c.pages.length > 1 ? menuPages(c).map(p => `<a href="#b-${p.id}" data-go="${p.id}">${esc(p.tab)}</a>`).join('')
    : !c.pages[0].steps.length ? `<a href="#b-${c.pages[0].id}" data-go="${c.pages[0].id}">${esc(c.pages[0].tab)}</a>` : c.pages[0].steps.map(s => `<a href="#b-${c.pages[0].id}" data-go="${c.pages[0].id}" data-step="${s.n}">${esc(s.t)}</a>`).join('');
  $('#gnb').innerHTML = CATS.map(c => `<div class="gi"><a href="#b-${c.pages[0].id}" data-cat="${esc(c.name)}">${esc(c.name)}</a><div class="sub">${subOf(c)}</div></div>`).join(''); fitMenu();
  $('#mcat').innerHTML = CATS.map(c => `<a href="#b-${c.pages[0].id}" data-cat="${esc(c.name)}">${esc(c.name)}</a>`).join('');
  $('#tiles').innerHTML = CATS.map(c => { const multi = c.pages.length > 1, im = srcOf(c.img);
    return `<div class="tile">${im ? `<img src="${im}" alt="">` : ''}<div class="ov"></div>${multi ? '' : `<button class="hit" type="button" data-go="${c.pages[0].id}" aria-label="${esc(c.name)} 보기"></button>`}
    <div class="ct"><span class="en">${esc(c.en)}</span><h2>${esc(c.name)}</h2><div class="ds"><span>${esc(c.desc)}</span>
    ${multi ? `<div class="pill">${menuPages(c).map(p => `<button type="button" data-go="${p.id}">${esc(p.tab)}</button>`).join('')}</div>` : `<button class="more" type="button" data-go="${c.pages[0].id}">MORE VIEW</button>`}</div></div></div>`; }).join('');
}
const narrow = () => matchMedia('(max-width:1100px)').matches;
let S = {view: 'home', sel: null, mi: 0, more: false, mode: '3d', scn: 'normal', pi: {ok: 0, bad: 0}, lbPair: false};
try { S.flt = localStorage.getItem('k2g-flt2') || 'pair'; } catch (e) { S.flt = 'pair'; }  // 기본: 정상·불량 나란히
const GN = {ok: '정상', bad: '불량'};
const counts = md => ({all: md.length, ok: md.filter(m => m[3] === 'ok').length, bad: md.filter(m => m[3] === 'bad').length});
/* 정상 = 초록 O, 불량 = 빨간 X 표시 (사진 위 오른쪽 위) */
const MARK = g => g === 'ok' ? '<i class="mk mk-ok" aria-label="정상"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="11" fill="none" stroke="#fff" stroke-width="4.5"/></svg></i>'
  : g === 'bad' ? '<i class="mk mk-bad" aria-label="불량"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M12 12l16 16M28 12L12 28" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/></svg></i>' : '';
function effFlt(md) { const c = counts(md); const f = S.flt; if (f === 'pair') return c.ok && c.bad ? 'pair' : 'all'; return f !== 'all' && !c[f] ? 'all' : f; }
const listOf = (md, f) => f === 'all' ? md : md.filter(m => m[3] === f);

function stepOf(b, id) { return b.steps.find(s => s.items.includes(id)); }

function go(view, keepSel) {
  const h = view === 'home' ? '#home' : '#b-' + view;
  if (location.hash !== h) { S.pendingSel = keepSel; location.hash = h; } else { route(keepSel); }
}
function route(keepSel) {
  const m = location.hash.match(/^#b-([a-z]+)$/);
  const v = m && byId[m[1]] ? m[1] : 'home';
  keepSel = keepSel || S.pendingSel; S.pendingSel = null;
  S.view = v; S.mi = 0; S.more = false; S.pi = {ok: 0, bad: 0};
  document.body.classList.toggle('inb', v !== 'home');
  document.querySelectorAll('[data-cat]').forEach(a => { const on = a.dataset.cat === catOf(v); a.classList.toggle('on', on); on ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'); });
  $('#home').hidden = v !== 'home'; $('#boardView').hidden = v === 'home';
  closeSheet();
  if (v !== 'home') {
    const b = byId[v];
    S.sel = keepSel && stepOf(b, keepSel) ? keepSel : (b.steps[0] ? b.steps[0].items[0] : null);
    renderBoard(); if (keepSel) { const r = document.querySelector(`.row[data-id="${keepSel}"]`); r && r.scrollIntoView({block: 'center'}); if (narrow()) openSheet(); }
  }
  const st = S.pendingStep; S.pendingStep = null; window.scrollTo({top: 0});

    ${textOnly && hasDet ? `<div class="det tonly"><div class="bd">${bodyHTML}</div></div>` : hasDet ? `<div class="det"><button type="button" id="moreBtn" aria-expanded="${S.more}">자세히 보기 · 예외와 대응<span class="plus" aria-hidden="true"></span></button>
      ${S.more ? `<div class="bd">${bodyHTML}</div>` : ''}</div>` : ''}
    <button class="ask" type="button" id="askBtn">이 항목 질문하기</button>`;
  bindBox();
}

function select(id) {
  S.force3d = false; S.sel = id; S.mi = 0; S.more = false; S.pi = {ok: 0, bad: 0};
  document.querySelectorAll('.row').forEach(r => r.classList.toggle('on', r.dataset.id === id));
  renderPanel(); if (narrow()) openSheet();
}
function openSheet() { $('#pnl').classList.add('open'); $('#dim').classList.add('show'); }
function closeSheet() { $('#pnl').classList.remove('open'); $('#dim').classList.remove('show'); }
function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('show'), 3200); }

/* lightbox */
function lbShow() {
  const all = IT[S.sel].media; if (!all.length) return;
  const f = effFlt(all); S.lbPair = f === 'pair';
  if (S.lbPair) {
    const fig = g => { const L = listOf(all, g), i = Math.min(S.pi[g], L.length - 1), m = L[i], k = KIND[g];
      return `<figure><img src="${m[1]}" alt="${esc(m[2])}"><figcaption><b style="margin-right:8px">${k[1]}</b>${esc(m[2])}</figcaption>${L.length > 1 ? `<div class="ctl"><button class="nb" type="button" data-pn="${g}:-1" aria-label="이전 ${GN[g]} 사진">‹</button>${i + 1} / ${L.length}<button class="nb" type="button" data-pn="${g}:1" aria-label="다음 ${GN[g]} 사진">›</button></div>` : ''}</figure>`; };
    $('#lbBody').innerHTML = `<div class="lbp">${fig('ok')}${fig('bad')}</div>`;
  } else {
    const md = listOf(all, f), mi = Math.min(S.mi, md.length - 1), c = md[mi];
    $('#lbBody').innerHTML = `${md.length > 1 ? '<button class="nb pv" type="button" id="lbPrev" aria-label="이전 사진">‹</button>' : ''}<img src="${c[1]}" alt="${esc(c[2])}"><p>${esc(c[2])} · ${mi + 1} / ${md.length}</p>${md.length > 1 ? '<button class="nb nx" type="button" id="lbNext" aria-label="다음 사진">›</button>' : ''}`;
  }
  $('#lb').classList.add('show'); $('#lbClose').focus();
}
function lbStep(d) { const all = IT[S.sel].media, f = effFlt(all); if (f === 'pair') return; const n = listOf(all, f).length; S.mi = (S.mi + d + n) % n; lbShow(); renderPanel(); }
function pairStep(g, d) { const n = listOf(IT[S.sel].media, g).length; S.pi[g] = (S.pi[g] + d + n) % n; renderPanel(); if ($('#lb').classList.contains('show')) lbShow(); }
function lbClose() { $('#lb').classList.remove('show'); }

/* search */
let hits = [], kSel = -1;
function search() {
  const q = norm($('#q').value), r = $('#res');
  if (!q) { r.classList.remove('show'); return; }
  const seen = new Set(); hits = INDEX.filter(e => e.h.includes(q) && !seen.has(e.x.id + e.b.id) && seen.add(e.x.id + e.b.id)).slice(0, 20); kSel = -1;
  r.innerHTML = hits.length ? hits.map((e, i) => `<button type="button" data-hit="${i}">${esc(e.x.text)}<small>${esc(e.b.tab)} · ${e.s.n}단계 ${esc(e.s.t)}${e.x.rid ? ' · ' + esc(e.x.rid) : ''}</small></button>`).join('') : '<div class="none">맞는 기준이 없습니다. 다른 낱말로 찾아보세요.</div>';
  r.classList.add('show');
}
function pick(i) { const e = hits[i]; if (!e) return; $('#res').classList.remove('show'); $('#q').value = ''; $('#q').blur(); go(e.b.id, e.x.id); }

/* print */
function buildPrint() {
  const b = byId[S.view]; $('#print').className = '';
  $('#print').innerHTML = `<div class="ph-h"><div style="display:flex;align-items:center;gap:6mm"><img src="${$('.logo .w').src}" alt="K2 KOREA"><div><div class="en">PARTNER DELIVERY GUIDE · PACKING BOARD</div><h1>${esc(b.title)}</h1></div></div><p>${esc(b.sub)}</p></div>
   <div class="ph-m" style="grid-template-columns:repeat(${b.steps.length},minmax(0,1fr))">${b.steps.map(s => `<section><span class="en">STEP 0${s.n}</span><h3>${esc(s.t)}</h3>${s.art ? `<div class="ph-a">${s.art}</div>` : ''}<ul>${s.items.map(id => { const x = IT[id]; return `<li>${esc(x.text)}${x.why ? `<small>이유: ${esc(x.why)}</small>` : ''}${x.tag || x.rid ? `<small>${tag(x.tag)} ${esc(x.rid)}</small>` : ''}</li>`; }).join('')}</ul></section>`).join('')}</div>
   <div class="ph-f"><span>기준: 물류납품규칙 V1.4 및 기존 작성 시안(최신 승인본 아님) · 설명 그림은 실제 승인 도안이 아님 · 사진과 예외는 납품가이드 사이트에서 확인</span><span>K2 KOREA · YEOJU LOGISTICS CENTER</span></div>`;
}

/* events */
document.addEventListener('click', e => {
  const sl = e.target.closest('.slides .slide'); if (sl && !e.target.closest('button')) { svK = +sl.dataset.k; svShow(); return; }
  if (e.target.id === 'sv') { svClose(); return; }
  const rs = e.target.closest('.rshot'); if (rs) { rs.classList.toggle('big'); return; }
  const pn = e.target.closest('[data-pn]'); if (pn) { e.stopPropagation(); const [g, d] = pn.dataset.pn.split(':'); pairStep(g, +d); return; }
  const t = e.target.closest('button, a'); if (!t) { if (!e.target.closest('.srch')) $('#res').classList.remove('show'); return; }
  if (!t.closest('.srch')) $('#res').classList.remove('show');
  if (t.dataset.go) { if (t.closest('#sv')) svClose(); e.preventDefault(); S.pendingStep = t.dataset.step || null; t.blur(); go(t.dataset.go, t.dataset.sel); return; }
  if (t.dataset.id) { select(t.dataset.id); return; }
  if (t.dataset.del) { FORM.rows.splice(+t.dataset.del, 1); $('#extra').innerHTML = formsHTML(); return; }
  if (t.dataset.ctab) { cTab = +t.dataset.ctab; calc = {t: 0, n: ''}; $('#extra').innerHTML = gtabsHTML(byId[S.view]) + costHTML(); return; }
  if (t.dataset.flow) { const st = byId[S.view].steps.find(x => x.n === t.dataset.flow); if (st) { select(st.items[0]); closeSheet(); const c = document.getElementById('st-' + st.n); if (c) { const y = c.getBoundingClientRect().top + scrollY - 150; window.scrollTo({top: y, behavior: 'smooth'}); c.classList.add('ping'); setTimeout(() => c.classList.remove('ping'), 900); } } return; }
  if (t.dataset.center) { cIdx = +t.dataset.center; $('#extra').innerHTML = centerHTML(); return; }
  if (t.dataset.mi) { S.mi = +t.dataset.mi; renderPanel(); return; }
  if (t.dataset.mode) { S.mode = t.dataset.mode; S.force3d = t.dataset.mode === '3d'; renderPanel(); return; }
  if (t.dataset.scn) { S.scn = t.dataset.scn; if (S.scn === 'missing') angle = ANG.B.slice(); bagY = S.scn === 'bagsame' ? 156 : -24; renderPanel(); return; }
  if (t.dataset.flip) { bagY = t.dataset.flip === 'back' ? 180 : 0; const c = $('#carton'); if (c) c.style.transform = `rotateX(-6deg) rotateY(${bagY}deg)`; return; }
  if (t.dataset.kg) { kg = +t.dataset.kg; renderPanel(); return; }
  if (t.dataset.ang) { angle = ANG[t.dataset.ang].slice(); const c = $('#carton'); if (c) c.style.transform = `rotateX(${angle[0]}deg) rotateY(${angle[1]}deg)`; return; }
  if (t.dataset.flt) { S.flt = t.dataset.flt; S.mi = 0; try { localStorage.setItem('k2g-flt2', S.flt); } catch (err) {} renderPanel(); return; }
  if (t.dataset.pz) { lbShow(); return; }
  if (t.dataset.hit) { pick(+t.dataset.hit); return; }
  switch (t.id) {
    case 'goHome': case 'goHome2': go('home'); break;
    case 'moreBtn': S.more = !S.more; renderPanel(); break;
    case 'shot': case 'zoomBtn': lbShow(); break;
    case 'lbPrev': lbStep(-1); break; case 'lbNext': lbStep(1); break; case 'lbClose': lbClose(); break;
    case 'closeSheet': closeSheet(); break;
    case 'svClose': svClose(); break; case 'svPrev': svK--; svShow(); break; case 'svNext': svK++; svShow(); break;
    case 'addRow': FORM.rows.push({code: '', name: '', qty: ''}); $('#extra').innerHTML = formsHTML(); { const r = document.querySelectorAll('.frr'); r[r.length - 1].querySelector('input').focus(); } break;
    case 'showSample': $('#paper').innerHTML = consentDoc(true); toast('작성 예시를 보여드립니다. 입력하면 다시 내 내용으로 바뀝니다.'); break;
    case 'printForm': $('#print').className = 'form'; $('#print').innerHTML = consentDoc(false); try { window.print(); } catch (err) { toast('이 화면에서는 인쇄가 막혀 있습니다. 사이트 파일을 브라우저로 열면 인쇄됩니다.'); } break;
    case 'copyAddr': (async () => { try { await navigator.clipboard.writeText(CENTERS[cIdx].addr || ''); toast('도로명 주소를 복사했습니다.'); } catch (err) { toast('복사가 막혀 있습니다. 브라우저에서 사이트 파일을 열면 복사됩니다.'); } })(); break;
    case 'toRules': { const c = document.getElementById('st-1'); c && c.scrollIntoView({behavior: 'smooth', block: 'start'}); } break;
    case 'askBtn': toast('질문하기는 기존 사이트의 납품 길잡이(챗봇)를 연결할 자리입니다.'); break;
    case 'printBtn': buildPrint(); try { window.print(); } catch (err) { toast('이 화면에서는 인쇄가 막혀 있습니다. 사이트 파일을 브라우저로 열면 A4 한 장으로 인쇄됩니다.'); } break;
  }
});
$('#dim').addEventListener('click', closeSheet);
$('#lb').addEventListener('click', e => { if (e.target.id === 'lb') lbClose(); });
$('#q').addEventListener('input', search);
const onForm = e => {
  const el = e.target;
  if (el.id === 'kgR') { kg = +el.value; const p = el.closest('.pnl'); renderPanel(); const r = $('#kgR'); r && r.focus(); return; }
  if (el.id === 'calcN' || el.id === 'calcT') { if (el.id === 'calcN') calc.n = el.value; else calc.t = +el.value; $('#calcR').innerHTML = costCalc(); return; } if (el.dataset.f) FORM[el.dataset.f] = el.value;
  else if (el.dataset.r) { const [i, k] = el.dataset.r.split(':'); FORM.rows[+i][k] = el.value; } else return;
  const pp = $('#paper'); if (pp) pp.innerHTML = consentDoc(false);
};
document.addEventListener('input', onForm); document.addEventListener('change', onForm);
$('#q').addEventListener('focus', search);
$('#sform').addEventListener('submit', e => { e.preventDefault(); pick(kSel >= 0 ? kSel : 0); });
$('#q').addEventListener('keydown', e => {
  if (!hits.length) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); kSel = (kSel + (e.key === 'ArrowDown' ? 1 : -1) + hits.length) % hits.length; document.querySelectorAll('.res button').forEach((x, i) => x.classList.toggle('k', i === kSel)); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { const r = document.querySelector('.rshot.big'); if (r) r.classList.remove('big'); }
  if ($('#sv').classList.contains('show')) { if (e.key === 'Escape') svClose(); if (e.key === 'ArrowLeft') { svK--; svShow(); } if (e.key === 'ArrowRight') { svK++; svShow(); } return; }
  const sk = e.target.closest && e.target.closest('.slides .slide'); if (sk && e.target === sk && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); svK = +sk.dataset.k; svShow(); return; }
  const pk = e.target.closest && e.target.closest('[data-pn]'); if (pk && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); const [g, d] = pk.dataset.pn.split(':'); pairStep(g, +d); return; }
  if ($('#lb').classList.contains('show')) { if (e.key === 'Escape') lbClose(); if (e.key === 'ArrowLeft') lbStep(-1); if (e.key === 'ArrowRight') lbStep(1); return; }
  if (e.key === 'Escape') { closeSheet(); $('#res').classList.remove('show'); }
});
window.addEventListener('hashchange', () => route());
/* close the dropdown after a menu pick; it opens again once the pointer leaves and comes back */
/* 하위 메뉴 개수가 늘어도 흰 판이 메뉴를 다 덮도록 가장 긴 하위 메뉴에 맞춥니다 */
function fitMenu() { const subs = [...document.querySelectorAll('#gnb .sub')]; if (!subs.length) return; const h = Math.max(...subs.map(x => x.scrollHeight)); document.documentElement.style.setProperty('--ddh', Math.ceil(h) + 'px'); }
window.addEventListener('resize', fitMenu); if (document.fonts) document.fonts.ready.then(fitMenu);
function shutMenu() { const a = document.activeElement; if (a && a.closest && a.closest('.hd')) a.blur(); $('.hd').classList.add('shut'); }
$('#gnb').addEventListener('click', e => { if (e.target.closest('a')) shutMenu(); });
$('#gnb').addEventListener('mouseleave', () => $('.hd').classList.remove('shut'));
$('#gnb').addEventListener('keydown', e => { if (e.key === 'Tab') $('.hd').classList.remove('shut'); });
window.addEventListener('beforeprint', () => { if (S.view !== 'home' && $('#print').className !== 'form') buildPrint(); });
window.addEventListener('afterprint', () => { $('#print').className = ''; });
build(BASE); renderChrome(); route(); loadSheet();
}
</script>
</body>
</html>
